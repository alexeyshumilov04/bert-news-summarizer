seed: 42
device: auto  # auto | cuda | cpu

data:
  dataset_name: IlyaGusev/gazeta
  split: train[:15%]
  test_size: 0.15
  max_input_length: 512
  max_target_length: 128
  batch_size: 8

model:
  bert_model_name: deepvk/bert-base-uncased
  hidden_size: 768
  num_decoder_layers: 3
  num_heads: 8
  dropout: 0.1

baseline:
  model_name: cointegrated/rut5-small

training:
  epochs: 6
  lr: 5.0e-5
  weight_decay: 0.01
  log_dir: artifacts/runs
  checkpoint_path: artifacts/best_model.pt
  tokenizer_dir: artifacts/tokenizer

generation:
  max_len: 50
  strategy: greedy   # greedy | top_k | nucleus | beam
  top_k: 50
  top_p: 0.9
  num_beams: 3